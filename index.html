<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="format-detection" content="telephone=no">
<title>KranProtokoll</title>
<meta name="theme-color" content="#202429">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="KranProtokoll">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
:root{
  --bg:#F3F1EC; --card:#FFFFFF; --ink:#1B1E22; --muted:#666B73; --line:#E0DCD3;
  --yellow:#F2B600; --yellow-soft:#FFF4CC; --dark:#202429;
  --ok:#1D8248; --ok-soft:#E3F3E9; --bad:#C2311D; --bad-soft:#FBE6E2; --na:#7D828A; --na-soft:#ECEDEF;
  --radius:12px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;font-size:16px;line-height:1.4;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:-apple-system,"SF Pro Display",system-ui,sans-serif;letter-spacing:-.2px;margin:0;font-weight:700}
.top{position:sticky;top:0;z-index:20;background:var(--dark);color:#fff;padding-top:env(safe-area-inset-top)}
.top-inner{max-width:880px;margin:0 auto;display:flex;align-items:center;gap:10px;padding:10px 16px}
.logo{width:30px;height:30px;flex:none}
.top h1{font-size:22px;font-weight:700}
.top h1 span{color:var(--yellow)}
.top .sp{flex:1}
.stripe{height:5px;background:repeating-linear-gradient(-45deg,var(--yellow) 0 12px,var(--dark) 12px 24px)}
.mode{font-size:12px;padding:3px 8px;border-radius:99px;background:#ffffff1f;color:#ddd;white-space:nowrap}
main{max-width:880px;margin:0 auto;padding:16px max(16px,env(safe-area-inset-right)) calc(100px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
.nav{position:fixed;bottom:0;left:0;right:0;z-index:30;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom)}
.nav button{flex:1;max-width:220px;background:none;border:0;padding:9px 4px 10px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer}
.nav button svg{width:24px;height:24px}
.nav button.on{color:var(--ink)}
.nav button.on svg{color:#C99700}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px}
.stack>*+*{margin-top:12px}
.row{display:flex;gap:10px;align-items:center}
.wrap{flex-wrap:wrap}
.muted{color:var(--muted)}
.small{font-size:13px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:#fff;border-radius:10px;padding:10px 14px;font-weight:600;cursor:pointer;min-height:44px;text-decoration:none;color:var(--ink)}
.btn.pri{background:var(--yellow);border-color:var(--yellow);color:#1B1E22}
.btn.dark{background:var(--dark);border-color:var(--dark);color:#fff}
.btn.danger{color:var(--bad);border-color:#efc3bb}
.btn.ghost{border-color:transparent;background:transparent}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sm{min-height:36px;padding:6px 10px;font-size:14px}
.btn.block{width:100%}
label.f{display:block;font-size:13px;font-weight:600;color:var(--muted);margin-bottom:4px}
.in{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:#fff;min-height:44px}
.in:focus{outline:2px solid var(--yellow);outline-offset:0;border-color:var(--yellow)}
textarea.in{min-height:80px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:560px){.grid2{grid-template-columns:1fr}}
.hdr{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin-bottom:12px}
.hdr h2{font-size:26px}
.badge{display:inline-block;font-size:12px;font-weight:700;padding:3px 8px;border-radius:99px;background:var(--na-soft);color:#444;white-space:nowrap}
.badge.y{background:var(--yellow-soft);color:#7a5c00}
.badge.g{background:var(--ok-soft);color:var(--ok)}
.badge.r{background:var(--bad-soft);color:var(--bad)}
.plist .card{cursor:pointer;display:block;width:100%;text-align:left}
.plist .card:hover{border-color:#cfc9bd}
.ptitle{font-weight:700;font-size:17px}
.prog{height:6px;background:var(--na-soft);border-radius:99px;overflow:hidden;margin-top:8px}
.prog i{display:block;height:100%;background:var(--yellow)}
.empty{text-align:center;padding:36px 16px}
.empty svg{width:72px;height:72px;color:#c9c3b6}
.tabs{position:sticky;top:calc(55px + env(safe-area-inset-top));z-index:15;background:var(--bg);margin:0 -16px 12px;padding:8px 16px;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--line)}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;border:1px solid var(--line);background:#fff;border-radius:99px;padding:7px 12px;font-size:14px;font-weight:600;cursor:pointer;white-space:nowrap;display:flex;gap:6px;align-items:center}
.tab.on{background:var(--dark);border-color:var(--dark);color:#fff}
.tab .c{font-size:12px;font-weight:700;opacity:.75}
.tab.done .c{color:var(--ok);opacity:1}
.tab.on.done .c{color:#8fe0b0}
.tab.bad .c{color:var(--bad);opacity:1}
.tab.on.bad .c{color:#ffb4a8}
.item{border:1px solid var(--line);border-radius:var(--radius);background:#fff;padding:12px}
.item.s-ok{border-left:5px solid var(--ok)}
.item.s-mangel{border-left:5px solid var(--bad);background:#fffaf9}
.item.s-na{border-left:5px solid var(--na)}
.item .t{font-weight:600}
.item .h{font-size:13px;color:var(--muted);margin-top:4px}
.seg{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.seg button{flex:1;min-width:60px;min-height:42px;border:1px solid var(--line);border-radius:10px;background:#fff;font-weight:700;cursor:pointer;font-size:14px}
.seg .ok.on{background:var(--ok);border-color:var(--ok);color:#fff}
.seg .mangel.on{background:var(--bad);border-color:var(--bad);color:#fff}
.seg .na.on{background:var(--na);border-color:var(--na);color:#fff}
.seg .nt{flex:0 0 auto;min-width:44px}
.seg .nt.has{background:var(--yellow-soft);border-color:#ecd27a}
.sub{margin-top:10px}
.secthead{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:4px 0 10px}
.secthead h3{font-size:21px}
.sig{display:flex;gap:12px;align-items:center;border:1px dashed #cfc9bd;border-radius:var(--radius);padding:10px;background:#fff}
.sig img{height:56px;max-width:150px;object-fit:contain;background:#fafafa;border-radius:6px}
.sig .who{flex:1;min-width:0}
.sig .role{font-weight:700}
.sigwarn .badge{white-space:normal;margin-top:4px}
.warn{background:var(--yellow-soft);border:1px solid #ecd27a;border-radius:10px;padding:10px 12px;font-size:14px}
.err{background:var(--bad-soft);border:1px solid #efc3bb;border-radius:10px;padding:10px 12px;font-size:14px;color:#7c1e10}
.okbox{background:var(--ok-soft);border:1px solid #b7dfc5;border-radius:10px;padding:10px 12px;font-size:14px;color:#145c33}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.ph{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff}
.ph img{width:100%;height:120px;object-fit:cover;display:block;background:#eee}
.ph .cap{padding:6px}
.ph .cap input{width:100%;border:0;border-bottom:1px solid var(--line);padding:4px 0;font-size:13px}
.ph .cap .row{justify-content:space-between;margin-top:4px}
.overlay{position:fixed;inset:0;background:#0008;z-index:50;display:flex;align-items:flex-end;justify-content:center}
@media (min-width:640px){.overlay{align-items:center}}
.sheet{background:#fff;width:100%;max-width:560px;border-radius:16px 16px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto}
@media (min-width:640px){.sheet{border-radius:16px}}
.sheet h3{font-size:22px;margin-bottom:10px}
.pad{width:100%;height:200px;border:2px solid var(--line);border-radius:10px;touch-action:none;background:#fff;display:block}
.padline{position:relative}
.padline:after{content:"Hier unterschreiben";position:absolute;left:14px;right:14px;bottom:44px;border-top:1px solid #d9d4ca;font-size:11px;color:#aaa;padding-top:2px;pointer-events:none}
.choice{display:grid;grid-template-columns:1fr;gap:8px}
.choice button{text-align:left;border:1px solid var(--line);border-radius:10px;background:#fff;padding:10px 12px;cursor:pointer}
.choice button.on{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink);background:#fbfaf7}
.choice b{display:block}
.toggle{display:flex;align-items:center;gap:10px;cursor:pointer;user-select:none}
.toggle input{width:22px;height:22px;accent-color:var(--dark)}
.hash{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;word-break:break-all;background:#f6f5f2;border-radius:8px;padding:8px}
.doclist a{color:var(--ink)}
.docrow{display:flex;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.docrow:first-child{border-top:0}
.docrow .ic{width:36px;height:36px;border-radius:8px;background:var(--yellow-soft);display:grid;place-items:center;flex:none;font-size:11px;font-weight:800;color:#7a5c00}
.docrow .nm{flex:1;min-width:0}
.docrow .nm a{font-weight:600;word-break:break-word}
.info h3{font-size:20px;margin-bottom:6px}
.info p,.info li{font-size:15px}
.info ul{padding-left:20px;margin:6px 0}
table.t{border-collapse:collapse;width:100%;font-size:14px}
table.t td,table.t th{border-bottom:1px solid var(--line);padding:6px 4px;text-align:left}
.toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--dark);color:#fff;padding:10px 16px;border-radius:10px;z-index:60;font-size:14px;max-width:90vw}
.backlink{display:inline-flex;align-items:center;gap:4px;background:none;border:0;font-weight:600;color:var(--muted);cursor:pointer;padding:6px 0;font-size:15px}
.ro-note{background:var(--ok-soft);border:1px solid #b7dfc5;border-radius:10px;padding:10px 12px;font-size:14px;color:#145c33;margin-bottom:12px}
fieldset{border:0;padding:0;margin:0;min-width:0}
.legend{font-weight:700;font-size:18px;margin:6px 0 10px}
.mrow{border-top:1px solid var(--line);padding:10px 0}
.mrow:first-child{border-top:0}

html{-webkit-tap-highlight-color:transparent}
body{overscroll-behavior-y:none}
.sigwarn .badge{white-space:normal;margin-top:4px}
.legend.sm{font-size:16px}
.docrow .nm{background:none;border:0;text-align:left;padding:0;cursor:pointer;display:flex;flex-direction:column}
.docrow .dn{font-weight:600;word-break:break-word;color:var(--ink);text-decoration:underline;text-decoration-color:#ccc}
.phbtn{display:block;width:100%;padding:0;border:0;background:#eee;cursor:pointer}
.info a{color:#7a5c00}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.stempel.on{border-color:#b7dfc5;background:var(--ok-soft)}
.stempel .big{font-size:34px;font-weight:800;letter-spacing:-.5px;font-variant-numeric:tabular-nums}
.pulse{width:14px;height:14px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 0 #1d824880;animation:pl 1.8s infinite}
@keyframes pl{70%{box-shadow:0 0 0 12px #1d824800}100%{box-shadow:0 0 0 0 #1d824800}}
.seg2{display:flex;background:#e7e3da;border-radius:10px;padding:3px;margin-top:14px}
.seg2 button{flex:1;border:0;background:none;padding:8px;border-radius:8px;font-weight:600;cursor:pointer}
.seg2 button.on{background:#fff;box-shadow:0 1px 2px #0002}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.kpis div{background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px}
.kpis span{display:block;font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpis b{font-size:16px;font-variant-numeric:tabular-nums}
.kpis .neg{color:var(--bad)} .kpis .pos{color:var(--ok)}
.dayhead{font-weight:700;font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;margin-top:6px}
.zrow{display:block;width:100%;text-align:left;cursor:pointer}
.warnline{color:#8a5a00;margin-top:2px}
.search{display:flex;gap:8px;padding:8px}
.search .in{flex:1}
.hit{display:block;width:100%;text-align:left;cursor:pointer}
.snip{margin-top:4px;color:#333}
mark{background:#ffe066;padding:0 1px;border-radius:2px}
.viewer{position:fixed;inset:0;z-index:70;background:#2a2e33;display:flex;flex-direction:column}
.vbar{display:flex;align-items:center;gap:8px;padding:calc(8px + env(safe-area-inset-top)) 10px 8px;background:var(--dark);color:#fff}
.vtitle{flex:1;min-width:0;display:flex;flex-direction:column;font-size:13px}
.vtitle b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vtitle span{color:#c9cdd2}
.btn.light{color:#fff}
.vbody{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;padding:8px}
.vpage canvas{display:block;background:#fff;box-shadow:0 2px 10px #0006}
.vfoot{display:flex;gap:8px;justify-content:center;padding:8px 8px calc(8px + env(safe-area-inset-bottom));background:var(--dark)}
.vfoot .btn{flex:1;max-width:120px}
.voll{display:flex;align-items:center;gap:6px;margin-top:8px}
.voll button{width:40px;height:32px;border:1px solid var(--line);border-radius:8px;background:#fff;font-weight:800;font-size:16px;cursor:pointer}
.voll button.on{background:var(--ok);border-color:var(--ok);color:#fff}
.voll button.on.neg{background:var(--bad);border-color:var(--bad)}
.seg .cam{display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--line);border-radius:10px;background:#fff;min-height:42px;cursor:pointer}
.thumbs{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.thumbs button{padding:0;border:0;border-radius:8px;overflow:hidden;width:64px;height:64px;background:#eee}
.thumbs img{width:100%;height:100%;object-fit:cover;display:block}
.ellip{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.installbar{position:fixed;left:12px;right:12px;bottom:calc(76px + env(safe-area-inset-bottom));z-index:40;background:#fff;border:2px solid var(--yellow);border-radius:14px;padding:12px 40px 12px 14px;font-size:14px;box-shadow:0 6px 24px #0003}
.installbar button{position:absolute;top:6px;right:6px;border:0;background:none;font-size:18px;padding:6px;cursor:pointer}
</style>
</head>
<body>
<header class="top">
  <div class="top-inner">
    <svg class="logo" viewBox="0 0 32 32" fill="none" aria-hidden="true"><path d="M8 30V6M8 6h20M8 6l6-4M14 2v4M8 12l6-6M24 6v8" stroke="#F2B600" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><rect x="21" y="14" width="6" height="5" rx="1" fill="#F2B600"/><path d="M4 30h10" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/></svg>
    <h1>Kran<span>Protokoll</span></h1>
  </div>
  <div class="stripe"></div>
</header>
<main id="app"></main>
<nav class="nav" id="nav">
  <button data-go="protokolle"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 8h6M9 12h6M9 16h3"/></svg>Protokolle</button>
  <button data-go="zeiten"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2M9 2h6"/></svg>Zeiten</button>
  <button data-go="krane"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 22V4h14M6 4l4-2v2M6 9l5-5M17 4v6"/><rect x="15" y="10" width="4" height="3"/><path d="M3 22h7"/></svg>Krane &amp; Pläne</button>
  <button data-go="mehr"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="5" cy="12" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="19" cy="12" r="1.3"/></svg>Mehr</button>
</nav>
<div id="modal"></div>
<script type="module" src="js/app.js"></script>
<div id="installHint"></div>
<script>
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
(function(){ var sa = window.navigator.standalone || matchMedia('(display-mode: standalone)').matches;
  var ios = /iphone|ipad|ipod/i.test(navigator.userAgent);
  try { if (sa || localStorage.getItem('kp_hint')) return; } catch(e) {}
  var el = document.getElementById('installHint');
  el.innerHTML = '<div class="installbar"><div><b>Als App installieren</b><br>' + (ios ? 'In Safari unten auf <b>Teilen</b> tippen, dann <b>„Zum Home-Bildschirm“</b>.' : 'Im Browser-Menü <b>„App installieren“</b> bzw. <b>„Zum Startbildschirm hinzufügen“</b> wählen.') + '</div><button aria-label="Schließen" onclick="try{localStorage.setItem(\'kp_hint\',1)}catch(e){};this.parentNode.remove()">✕</button></div>';
})();
</script>
</body>
</html>
